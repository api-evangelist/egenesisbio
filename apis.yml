name: eGenesis
description: eGenesis is a clinical-stage biotechnology company based in Cambridge, Massachusetts,
  developing human-compatible, genetically engineered organs to address the global organ shortage.
  Using a proprietary CRISPR-based multiplex genome-editing platform, eGenesis modifies the porcine
  genome to inactivate endogenous retroviruses and add protective human transgenes, producing pig
  kidneys, livers, and hearts intended for xenotransplantation. Its lead program, EGEN-2784, is a
  genetically engineered porcine kidney being evaluated in an expanded-access study. This API
  Evangelist profile tracks the company; eGenesis publishes no public developer API.
